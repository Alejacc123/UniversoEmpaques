<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Iniciar sesión — Universo Empaques</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,600;0,700;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

<div class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="card shadow-sm p-4" style="width:380px;">

    <div class="text-center mb-3">
      <span class="brand-word fs-3">UNIVERSO<span class="text-ue">.</span></span>
      <div class="d-flex align-items-center gap-2 mt-1">
        <div class="rule"></div><span class="brand-sub">EMPAQUES</span><div class="rule"></div>
      </div>
    </div>

    <h6 class="text-center text-muted mb-3">Inicia sesión</h6>

    <!-- Mensajes de error o de registro/cierre de sesion exitoso -->
    <div th:if="${param.error}" class="alert alert-danger py-2 small">
      Correo o contraseña incorrectos.
    </div>
    <div th:if="${param.registrado}" class="alert alert-success py-2 small">
      Cuenta creada correctamente. Ya puedes iniciar sesión.
    </div>
    <div th:if="${param.logout}" class="alert alert-info py-2 small">
      Sesión cerrada correctamente.
    </div>

    <form th:action="@{/login}" method="post">
      <div class="mb-3">
        <label class="form-label small">Correo electrónico</label>
        <input type="email" name="username" class="form-control" placeholder="correo@ejemplo.com" required autofocus>
      </div>
      <div class="mb-2">
        <label class="form-label small">Contraseña</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-ue w-100 mt-3">Iniciar sesión</button>
    </form>

    <p class="text-center small text-muted mt-3 mb-0">
      ¿No tienes cuenta? <a th:href="@{/registro}" class="text-ue">Regístrate</a>
    </p>
  </div>
</div>

</body>
</html>
