<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Mi panel')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="layout">
    <aside th:replace="~{fragments/layout :: sidebar('cliente-panel')}"></aside>

    <main class="contenido">
        <th:block th:replace="~{fragments/layout :: mensajes}"></th:block>
        <h4 class="mb-1" th:text="'Hola, ' + ${nombre}">Hola</h4>
        <p class="text-muted small mb-4">Desde aquí solicitas cotizaciones y sigues tus pedidos.</p>

        <div th:if="${cotizacionesPorResponder gt 0}" class="alert alert-info py-2 small">
            Tienes <strong th:text="${cotizacionesPorResponder}">1</strong> cotización(es) con valor esperando tu respuesta.
            <a class="alert-link" th:href="@{/cliente/cotizaciones}">Revisar</a>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-12 col-sm-4">
                <a class="card tarjeta-dato p-3 h-100 text-decoration-none text-reset" th:href="@{/cliente/cotizaciones}">
                <div class="dato-cabecera"><span class="dato-icono"><svg class="ic"><use th:href="@{/img/iconos.svg#mensaje}"/></svg></span><span class="text-muted small">Por responder</span></div>
                <div class="fs-3 fw-bold" th:text="${cotizacionesPorResponder}">0</div>
                </a>
            </div>
            <div class="col-12 col-sm-4">
                <a class="card tarjeta-dato p-3 h-100 text-decoration-none text-reset" th:href="@{/cliente/cotizaciones}">
                <div class="dato-cabecera"><span class="dato-icono"><svg class="ic"><use th:href="@{/img/iconos.svg#cotizaciones}"/></svg></span><span class="text-muted small">Mis cotizaciones</span></div>
                <div class="fs-3 fw-bold" th:text="${totalCotizaciones}">0</div>
                </a>
            </div>
            <div class="col-12 col-sm-4">
                <a class="card tarjeta-dato p-3 h-100 text-decoration-none text-reset" th:href="@{/cliente/pedidos}">
                <div class="dato-cabecera"><span class="dato-icono"><svg class="ic"><use th:href="@{/img/iconos.svg#pedidos}"/></svg></span><span class="text-muted small">Mis pedidos</span></div>
                <div class="fs-3 fw-bold" th:text="${totalPedidos}">0</div>
                </a>
            </div>
        </div>

        <a class="btn btn-ue" th:href="@{/cliente/cotizaciones/nueva}"><svg class="ic"><use th:href="@{/img/iconos.svg#mas}"/></svg>Solicitar cotización</a>

        <a class="btn btn-outline-ue ms-2" th:href="@{/cliente/pedidos/nuevo}"><svg class="ic"><use th:href="@{/img/iconos.svg#mas}"/></svg>Solicitar pedido</a>
    </main>
</div>

</body>
</html>
