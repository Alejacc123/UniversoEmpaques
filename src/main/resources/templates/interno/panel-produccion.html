<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Panel Producción — Universo Empaques</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,600;0,700;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

<nav class="navbar navbar-dark navbar-ue px-4">
  <span class="navbar-brand brand-word fs-5 mb-0">UNIVERSO<span class="text-ue">.</span></span>
  <div class="d-flex align-items-center gap-3">
    <span class="badge bg-ue">Cargo: Producción</span>
    <span class="text-white small" th:text="${nombre}">Usuario</span>
    <form th:action="@{/logout}" method="post" class="mb-0">
      <button class="btn btn-outline-light btn-sm">Cerrar sesión</button>
    </form>
  </div>
</nav>

<div class="d-flex">
  <div class="sidebar p-3" style="width:230px;">
    <div class="nav flex-column gap-1">
      <a class="nav-link active">Inicio</a>
    </div>
  </div>
  <div class="flex-grow-1 p-4">
    <h4 class="mb-4">Panel de Producción</h4>
    <div class="alert alert-light border">
      Este panel se ira completando en las siguientes iteraciones con: actualizar el estado de producción de un pedido (RF-14) y consultar su estado (RF-15).
    </div>
  </div>
</div>

</body>
</html>
