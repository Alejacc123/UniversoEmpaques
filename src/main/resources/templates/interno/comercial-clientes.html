<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="layout">
    <aside th:replace="~{fragments/layout :: sidebar('comercial-clientes')}"></aside>

    <main class="contenido">
        <th:block th:replace="~{fragments/layout :: mensajes}"></th:block>
        <div th:if="${param.actualizado}" class="alert alert-success py-2 small">Cliente actualizado correctamente.</div>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">Clientes registrados</h4>
            <span class="text-muted small" th:text="${#lists.size(clientes)} + ' en total'">0</span>
        </div>

        
        <input type="search" class="form-control form-control-sm buscador" data-filtro-tabla="tablaClientes" placeholder="Buscar por NIT, nombre, correo...">

        <div class="card p-3 table-responsive">
            <table id="tablaClientes" class="table table-sm table-hover align-middle mb-0">
                <thead class="text-muted small">
                <tr><th>NIT</th><th>Nombre</th><th>Correo</th><th>Celular</th><th>Dirección</th><th>Estado</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="c : ${clientes}">
                    <td th:text="${c.nit}">900123456</td>
                    <td th:text="${c.nombre}">Nombre</td>
                    <td th:text="${c.correo}">correo@ejemplo.com</td>
                    <td th:text="${c.celular ?: '—'}">-</td>
                    <td th:text="${c.direccion ?: '—'}">-</td>
                    <td>
                        <span class="status-pill"
                              th:classappend="${c.estaActivo()} ? 'status-terminado' : 'status-rechazado'"
                              th:text="${c.estaActivo()} ? 'Activo' : 'Inactivo'">Activo</span>
                    </td>
                    <td><a class="btn btn-sm btn-outline-ue" th:href="@{/comercial/clientes/{nit}/editar(nit=${c.nit})}">Ver / Editar</a></td>
                </tr>
                <tr data-sin-datos th:if="${#lists.isEmpty(clientes)}">
                    <td colspan="7" class="text-muted text-center py-3">Aún no hay clientes registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<script th:src="@{/js/filtro-tabla.js}"></script>
</body>
</html>
