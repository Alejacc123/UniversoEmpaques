<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Pedidos')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="layout">
    <aside th:replace="~{fragments/layout :: sidebar(${area + '-pedidos'})}"></aside>

    <main class="contenido">
        <th:block th:replace="~{fragments/layout :: mensajes}"></th:block>
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <h4 class="mb-0" th:text="'Pedidos — ' + ${tituloArea}">Pedidos</h4>
            <div class="btn-group btn-group-sm">
                <a class="btn" th:classappend="${!todos} ? 'btn-ue' : 'btn-outline-ue'" th:href="@{/{a}/pedidos(a=${area})}">Por atender</a>
                <a class="btn" th:classappend="${todos} ? 'btn-ue' : 'btn-outline-ue'" th:href="@{/{a}/pedidos(a=${area}, todos=true)}">Todos</a>
            </div>
        </div>

        <p class="text-muted small" th:unless="${todos}">
            Pedidos que están en
            <th:block th:each="c, st : ${estadosCola}"><strong th:text="${c.etiqueta}">-</strong><span th:unless="${st.last}"> o </span></th:block>
            y esperan que tu área los gestione. Los más antiguos van primero.
        </p>

        <input type="search" class="form-control form-control-sm buscador" data-filtro-tabla="tablaCola" placeholder="Buscar por número o cliente...">

        <div class="card p-3 table-responsive">
            <table id="tablaCola" class="table table-sm table-hover align-middle mb-0">
                <thead class="text-muted small">
                <tr><th>N.º</th><th>Cliente</th><th>Entrega</th><th>Estado</th><th>Desde</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="e : ${filas}">
                    <td th:text="'PED-' + ${e.pedido.codigo}">PED-1</td>
                    <td th:text="${e.pedido.cliente != null ? e.pedido.cliente.nombre : '—'}">Cliente</td>
                    <td th:text="${e.pedido.fechaEntrega != null ? #temporals.format(e.pedido.fechaEntrega, 'dd/MM/yyyy') : '—'}">-</td>
                    <td><span class="status-pill" th:classappend="${e.estado.claseCss}" th:text="${e.estado.etiqueta}">Estado</span></td>
                    <td class="small text-muted" th:text="${#temporals.format(e.fechaInicio, 'dd/MM/yyyy HH:mm')}">-</td>
                    <td><a class="btn btn-sm btn-outline-ue" th:href="@{/{a}/pedidos/{id}(a=${area}, id=${e.pedido.codigo})}">Ver</a></td>
                </tr>
                <tr data-sin-datos th:if="${#lists.isEmpty(filas)}">
                    <td colspan="6" class="text-muted text-center py-3"
                        th:text="${todos} ? 'Aún no hay pedidos.' : 'No hay pedidos pendientes para tu área. ¡Todo al día!'">-</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<script th:src="@{/js/filtro-tabla.js}"></script>

</body>
</html>
