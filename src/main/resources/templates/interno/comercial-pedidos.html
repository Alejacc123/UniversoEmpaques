<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Pedidos')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="layout">
    <aside th:replace="~{fragments/layout :: sidebar('comercial-pedidos')}"></aside>

    <main class="contenido">
        <th:block th:replace="~{fragments/layout :: mensajes}"></th:block>
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <h4 class="mb-0">Pedidos</h4>
            <a class="btn btn-ue btn-sm" th:href="@{/comercial/pedidos/nuevo}">+ Registrar pedido</a>
        </div>

        <input type="search" class="form-control form-control-sm buscador" data-filtro-tabla="tablaPedidos" placeholder="Buscar por número o cliente...">

        <div class="card p-3 table-responsive">
            <table id="tablaPedidos" class="table table-sm align-middle mb-0">
                <thead class="text-muted small">
                <tr><th>N.º</th><th>Cliente</th><th>Registrado</th><th>Entrega</th><th>Estado actual</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="p : ${pedidos}">
                    <td th:text="'PED-' + ${p.codigo}">PED-1</td>
                    <td>
                        <span th:text="${p.cliente != null ? p.cliente.nombre : '—'}">Cliente</span>
                        <span th:if="${p.usuario == null}" class="status-pill status-cotizado ms-1" title="El cliente lo pidió desde la plataforma">Web</span>
                    </td>
                    <td th:text="${#temporals.format(p.fechaRegistro, 'dd/MM/yyyy')}">-</td>
                    <td th:text="${p.fechaEntrega != null ? #temporals.format(p.fechaEntrega, 'dd/MM/yyyy') : '—'}">-</td>
                    <td th:with="e=${pedidoService.estadoActual(p)}">
                        <span th:if="${e != null}" class="status-pill" th:classappend="${e.estado.claseCss}" th:text="${e.estado.etiqueta}">Estado</span>
                        <span th:if="${e == null}" class="text-muted small">Sin estado</span>
                    </td>
                    <td><a class="btn btn-sm btn-outline-ue" th:href="@{/comercial/pedidos/{id}(id=${p.codigo})}">Ver</a></td>
                </tr>
                <tr data-sin-datos th:if="${#lists.isEmpty(pedidos)}">
                    <td colspan="6" class="text-muted text-center py-3">Aún no hay pedidos registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<script th:src="@{/js/filtro-tabla.js}"></script>
</body>
</html>
