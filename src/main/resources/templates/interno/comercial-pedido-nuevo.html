<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Nuevo pedido')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="layout">
    <aside th:replace="~{fragments/layout :: sidebar('comercial-pedidos')}"></aside>

    <main class="contenido">
        <th:block th:replace="~{fragments/layout :: mensajes}"></th:block>
        <h4 class="mb-4">Registrar pedido</h4>

        <div th:if="${errorNegocio}" class="alert alert-danger py-2 small" th:text="${errorNegocio}"></div>

        <div class="card p-4" style="max-width:520px;">
            <form th:action="@{/comercial/pedidos}" th:object="${registrarPedidoForm}" method="post">

                <div class="mb-2">
                    <label class="form-label small">Cliente</label>
                    <select class="form-select" th:field="*{nitCliente}"
                            th:classappend="${#fields.hasErrors('nitCliente')} ? 'is-invalid'">
                        <option value="">-- Selecciona un cliente --</option>
                        <option th:each="c : ${clientes}" th:value="${c.nit}"
                                th:text="${c.nombre + ' — NIT ' + c.nit}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nitCliente')}" th:errors="*{nitCliente}"></div>
                </div>

                <div class="mb-2">
                    <label class="form-label small">Fecha de entrega estimada</label>
                    <input type="date" class="form-control" th:field="*{fechaEntrega}"
                           th:attr="min=${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}"
                           th:classappend="${#fields.hasErrors('fechaEntrega')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaEntrega')}" th:errors="*{fechaEntrega}"></div>
                </div>

                <div class="mb-2">
                    <label class="form-label small">Forma de pago</label>
                    <select class="form-select" th:field="*{formaPago}">
                        <option value="">-- Por definir --</option>
                        <option value="Contado">Contado</option>
                        <option value="Transferencia">Transferencia</option>
                        <option value="Crédito 30 días">Crédito 30 días</option>
                        <option value="50% anticipo">50% anticipo</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label small">Dirección de entrega</label>
                    <input type="text" class="form-control" th:field="*{direccionEntrega}" maxlength="200"
                           placeholder="Vacío = dirección registrada del cliente">
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-ue">Crear pedido</button>
                    <a class="btn btn-outline-secondary" th:href="@{/comercial/pedidos}">Cancelar</a>
                </div>
            </form>
        </div>

        <p class="text-muted small mt-3">
            Después de crear el pedido podrás agregarle los productos y cantidades desde su pantalla de detalle.
        </p>
    </main>
</div>

</body>
</html>
