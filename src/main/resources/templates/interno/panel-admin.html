<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Administración')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="layout">
    <aside th:replace="~{fragments/layout :: sidebar('admin-panel')}"></aside>

    <main class="contenido">
        <th:block th:replace="~{fragments/layout :: mensajes}"></th:block>
        <h4 class="mb-1" th:text="'Hola, ' + ${nombre}">Hola</h4>
        <p class="text-muted small mb-4">Panel de administración del sistema.</p>

        <div class="row g-3 mb-4">
            <div class="col-6 col-lg-3">
                <a class="card tarjeta-dato p-3 h-100 text-decoration-none text-reset" th:href="@{/admin/usuarios}">
                <div class="text-muted small">Usuarios internos</div>
                <div class="fs-3 fw-bold" th:text="${totalUsuarios}">0</div>
                </a>
            </div>
            <div class="col-6 col-lg-3">
                <a class="card tarjeta-dato p-3 h-100 text-decoration-none text-reset" th:href="@{/comercial/clientes}">
                <div class="text-muted small">Clientes registrados</div>
                <div class="fs-3 fw-bold" th:text="${totalClientes}">0</div>
                </a>
            </div>
            <div class="col-6 col-lg-3">
                <a class="card tarjeta-dato p-3 h-100 text-decoration-none text-reset" th:href="@{/comercial/pedidos}">
                <div class="text-muted small">Pedidos</div>
                <div class="fs-3 fw-bold" th:text="${totalPedidos}">0</div>
                </a>
            </div>
            <div class="col-6 col-lg-3">
                <a class="card tarjeta-dato p-3 h-100 text-decoration-none text-reset" th:href="@{/admin/respaldos}">
                    <div class="text-muted small">Última copia de seguridad</div>
                    <div class="fw-bold mt-1" th:text="${ultimoRespaldo != null ? #temporals.format(ultimoRespaldo, 'dd/MM/yyyy HH:mm') : 'Ninguna'}">-</div>
                </a>
            </div>
        </div>

        <div class="d-flex gap-2 flex-wrap mb-4">
            <a class="btn btn-ue btn-sm" th:href="@{/admin/usuarios/nuevo}">+ Registrar usuario</a>
            <a class="btn btn-outline-ue btn-sm" th:href="@{/admin/reportes}">Reportes</a>
            <a class="btn btn-outline-ue btn-sm" th:href="@{/admin/respaldos}">Copias de seguridad</a>
        </div>

    </main>
</div>

</body>
</html>
