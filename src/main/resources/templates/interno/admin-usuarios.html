<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Usuarios')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="layout">
    <aside th:replace="~{fragments/layout :: sidebar('admin-usuarios')}"></aside>

    <main class="contenido">
        <th:block th:replace="~{fragments/layout :: mensajes}"></th:block>
        <div th:if="${param.guardado}" class="alert alert-success py-2 small">Usuario guardado correctamente.</div>
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <h4 class="mb-0">Usuarios internos</h4>
            <a class="btn btn-ue btn-sm" th:href="@{/admin/usuarios/nuevo}">+ Registrar usuario</a>
        </div>


        <input type="search" class="form-control form-control-sm buscador" data-filtro-tabla="tablaUsuarios" placeholder="Buscar por nombre, correo, área...">

        <div class="card p-3 table-responsive">
            <table id="tablaUsuarios" class="table table-sm align-middle mb-0">
                <thead class="text-muted small">
                <tr><th>Nombre</th><th>Correo</th><th>Documento</th><th>Teléfono</th><th>Área</th><th>Rol</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.nombre}">Nombre</td>
                    <td th:text="${u.correo}">correo@ejemplo.com</td>
                    <td th:text="${u.numDocumento ?: '—'}">-</td>
                    <td th:text="${u.telefonoPersonal ?: '—'}">-</td>
                    <td th:text="${u.areaPrincipal != null ? u.areaPrincipal.nombreVisible : '—'}">Área</td>
                    <td>
                        <span class="status-pill" th:classappend="${u.esAdministrador()} ? 'status-despachado' : 'status-cotizado'"
                              th:text="${u.rolPrincipal != null ? u.rolPrincipal.nombre : '—'}">Rol</span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-ue" th:href="@{/admin/usuarios/{id}/editar(id=${u.codigo})}">Editar</a>
                        <!-- No se muestra "Eliminar" en la fila de quien inicio sesion -->
                        <form th:unless="${u.codigo == #authentication.principal.usuario.codigo}"
                              th:action="@{/admin/usuarios/{id}/eliminar(id=${u.codigo})}" method="post" class="d-inline"
                              th:data-nombre="${u.nombre}"
                              onsubmit="return confirm('¿Eliminar a ' + this.dataset.nombre + '? Esta acción no se puede deshacer.');">
                            <button class="btn btn-sm btn-outline-danger">Eliminar</button>
                        </form>
                        <span th:if="${u.codigo == #authentication.principal.usuario.codigo}" class="text-muted small ms-1">(tú)</span>
                    </td>
                </tr>
                <tr data-sin-datos th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="7" class="text-muted text-center py-3">Aún no hay usuarios registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<script th:src="@{/js/filtro-tabla.js}"></script>
</body>
</html>
