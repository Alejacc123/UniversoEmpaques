<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Bodega')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="layout">
    <aside th:replace="~{fragments/layout :: sidebar('bodega-panel')}"></aside>

    <main class="contenido">
        <th:block th:replace="~{fragments/layout :: mensajes}"></th:block>
        <h4 class="mb-1" th:text="'Hola, ' + ${nombre}">Hola</h4>
        <p class="text-muted small mb-4">Panel de Bodega: estos son los pedidos que dependen de tu área.</p>

        <div class="row g-3 mb-4">
            <div class="col-12 col-sm-6 col-lg-4">
                <a class="card tarjeta-dato p-3 h-100 text-decoration-none text-reset" th:href="@{/bodega/pedidos}">
                    <div class="dato-cabecera"><span class="dato-icono"><svg class="ic"><use th:href="@{/img/iconos.svg#bodega}"/></svg></span><span class="text-muted small">Pedidos por despachar o entregar</span></div>
                    <div class="fs-3 fw-bold" th:text="${enCola}">0</div>
                    <div class="small text-muted">Ver la cola de trabajo</div>
                </a>
            </div>
        </div>
        <a class="btn btn-ue btn-sm" th:href="@{/bodega/pedidos}">Ir a pedidos</a>
    </main>
</div>

</body>
</html>
