# =====================================================================
# Sistema de Gestion de Repartos de Empaques - Universo Empaques
#
# ESTE ARCHIVO ES COMPARTIDO (va en Git): NO pongan aqui su contrasena
# ni rutas de su computador.
#
# Lo que cambia de un computador a otro (contrasena de MySQL, puerto,
# correo, rutas de respaldo...) va en el archivo PERSONAL
#     application-local.properties   (en la raiz del proyecto)
# que Git ignora. Para crearlo, copien "application-local.properties.example"
# y cambien solo lo que necesiten. Si no existe, se usan los valores
# por defecto de abajo (lo que va despues de los ":").
# =====================================================================

# Carga el archivo personal si existe (lo que tenga ahi tiene prioridad).
spring.config.import=optional:file:./application-local.properties

spring.application.name=gestion-repartos-empaques

# ---------------------------------------------------------------------
# Base de datos MySQL
# ---------------------------------------------------------------------
db.host=localhost
db.puerto=3306
db.usuario=root
db.contrasena=universo123
spring.datasource.url=jdbc:mysql://${db.host}:${db.puerto}/universo_empaques?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${db.usuario}
spring.datasource.password=${db.contrasena}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------
# JPA / Hibernate
# "validate": Hibernate NO crea ni modifica tablas. Solo revisa, al
# arrancar, que cada entidad coincida con las tablas creadas por
# db/schema.sql. Si algo no coincide, la app no arranca y el log dice
# exactamente que tabla/columna falla.
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
# Usa los nombres de @Table/@Column tal cual (PascalCase), sin
# convertirlos a snake_case (FechaRegistro -> fecha_registro).
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------
# Correo (RF-16: notificaciones al cliente). Las credenciales reales
# van SOLO en application-local.properties.
# ---------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------------------------------------------------------------------
# Servidor
# 0.0.0.0 = escuchar en todas las interfaces de red, para poder abrir la
# app desde otros dispositivos de la misma red: http://<IP-del-PC>:8080
# ---------------------------------------------------------------------
server.port=8080
server.address=0.0.0.0

# Usuarios de prueba (uno por cada tipo, contrasena "prueba123"; ver README).
# En el computador de PRODUCCION: app.datos-prueba=false en application-local.properties
app.datos-prueba=true

# Archivos de diseno y fotos de cotizacion: maximo 5 MB por archivo
# (las columnas son MEDIUMBLOB, hasta 16 MB).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Desactiva la cache de plantillas: los cambios en los .html se ven al recargar.
spring.thymeleaf.cache=false

# ---------------------------------------------------------------------
# Copia de seguridad (RF-19)
# Apagada por defecto en los computadores de desarrollo. Se activa en el
# computador que haga de servidor, en su application-local.properties,
# junto con las rutas de mysqldump/mysql de ESE computador.
# ---------------------------------------------------------------------
backup.activo=false
backup.directorio=./respaldos
backup.directorio-copia=
backup.cron=0 0 19 * * *
backup.host=${db.host}
backup.puerto=${db.puerto}
backup.ruta-mysqldump=mysqldump
backup.ruta-mysql=mysql
