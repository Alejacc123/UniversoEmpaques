# =====================================================================
# Sistema de Gestion de Repartos de Empaques - Universo Empaques
# =====================================================================

# Nombre de la aplicacion
spring.application.name=gestion-repartos-empaques

# ---------------------------------------------------------------------
# Conexion a la base de datos MySQL (red local)
# Cambien "localhost" por la IP del servidor si la base de datos
# corre en otro computador de la red local.
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/universo_empaques?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=universo123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------
# JPA / Hibernate
# "update" crea/ajusta las tablas automaticamente a partir de las
# entidades. Si prefieren controlar el esquema solo con schema.sql,
# cambien esto a "validate" o "none".
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------
# Correo electronico (RF-16: notificaciones automaticas al cliente)
# Ejemplo con Gmail: hay que generar una "contrasena de aplicacion"
# en la cuenta de Google que se use para enviar los correos.
# ---------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=CAMBIAR_CORREO@gmail.com
spring.mail.password=CAMBIAR_CONTRASENA_DE_APLICACION
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------------------------------------------------------------------
# Servidor
# ---------------------------------------------------------------------
server.port=8080

# ---------------------------------------------------------------------
# Thymeleaf: desactivar la cache de plantillas mientras se desarrolla,
# para que los cambios en los .html se vean sin reiniciar el servidor.
# ---------------------------------------------------------------------
spring.thymeleaf.cache=false
